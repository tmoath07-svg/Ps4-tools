<footer>المعالجة تتم داخل المتصفح ولا تُرفع ملفاتك إلى أي سيرفر. تحويل الموديلات وتفسير بنية RSC7 يحتاجان اختبارًا بملفات معروفة؛ لا تعتمد على الملف الناتج قبل تجربته داخل اللعبة. بناء OTD باستخدام ragebuilder.exe غير متاح داخل المتصفح.</footer>

<script>
'use strict';
const enc = new TextEncoder();
async function streamTransform(data, format, mode='decompress'){
  if (typeof DecompressionStream === 'undefined' && mode === 'decompress') throw new Error('المتصفح لا يدعم فك الضغط. حدّث Safari.');
  if (typeof CompressionStream === 'undefined' && mode === 'compress') throw new Error('المتصفح لا يدعم الضغط. حدّث Safari.');
  const C = mode === 'compress' ? CompressionStream : DecompressionStream;
  try {
    const stream = new Blob([data]).stream().pipeThrough(new C(format));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) { throw new Error('فشل ' + (mode === 'compress' ? 'ضغط' : 'فك ضغط') + ' البيانات بصيغة ' + format + ': ' + (e.message || e)); }
}
async function inflateRaw(d){ return streamTransform(d, 'deflate-raw', 'decompress'); }
async function inflateRawRsc7(payload){
  try { return {decoded: await inflateRaw(payload), tail: new Uint8Array(0)}; }
  catch (initialError) {
    if (!/extra bytes past the end/i.test(initialError.message || '')) throw initialError;
  }

  // Some RSC7 files contain bytes after the raw-deflate stream. Find the
  // stream boundary instead of feeding those trailing bytes to DecompressionStream.
  let lo = 1, hi = payload.length - 1, end = -1, lastError = null;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    try {
      const decoded = await inflateRaw(payload.subarray(0, mid));
      return {decoded, tail: payload.slice(mid)};
    } catch (e) {
      lastError = e;
      if (/extra bytes past the end/i.test(e.message || '')) {
        hi = mid - 1;
      } else {
        lo = mid + 1;
      }
    }
  }

  // Browser error wording differs, so check a small neighborhood around the
  // estimated boundary before failing safely.
  const start = Math.max(1, lo - 16);
  const stop = Math.min(payload.length - 1, lo + 16);
  for (let n = start; n <= stop; n++) {
    try {
      const decoded = await inflateRaw(payload.subarray(0, n));
      end = n;
      return {decoded, tail: payload.slice(end)};
    } catch (e) { lastError = e; }
  }
  throw new Error('تعذّر تحديد نهاية تدفق RSC7 المضغوط بأمان. ' + (lastError?.message || ''));
}
async function deflateRaw(d){ return streamTransform(d, 'deflate-raw', 'compress'); }
const concat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length;}return o;};
const isRSC7=d=>d.length>=16&&d[0]===0x52&&d[1]===0x53&&d[2]===0x43&&d[3]===0x37;
const stem=n=>n.replace(/\.[^.]*$/,'');
const ext=n=>(n.match(/\.[^.]*$/)||[''])[0].toLowerCase();

'.yft':['.oft',true,'Fragment model'],'.ydr':['.odr',true,'Drawable model'],'.ydd':['.odd',true,'Drawable dictionary'],
'.ypt':['.opt',true,'Particle effect'],'.ybn':['.obn',true,'Collision bounds'],'.ybd':['.obd',true,'Bounds dictionary'],
'.ycd':['.ocd',false,'Animation clips'],'.ymap':['.omap',false,'Map placement'],'.ytyp':['.otyp',false,'Archetype definition'],'.ymt':['.omt',false,'Metadata file']
};
async function convertModel(name,data,log){
  const t=FILE_TYPES[ext(name)];
  if(!t){log('  [SKIP] امتداد غير مدعوم: '+name);return null;}
  const [outExt,patch,desc]=t,outName=stem(name)+outExt;
  log('  ['+desc+'] '+name);
  if(!patch){log('  [WARN] هذا النوع يغيّر الامتداد فقط في هذه الأداة؛ لم يتم تحويل بنية الملف.');return {name:outName,data};}
  if(!isRSC7(data)){log('  [ERROR] الملف ليس RSC7. لن أغيّر امتداده وكأنه تحوّل.');return null;}
  let dec, tail;
  try{
    const unpacked=await inflateRawRsc7(data.subarray(16));
    dec=unpacked.decoded;tail=unpacked.tail;
    if(tail.length)log('  [INFO] تم الحفاظ على '+tail.length.toLocaleString()+' بايت إضافية بعد تدفق الضغط.');
  }catch(e){log('  [ERROR] تعذّر فك ضغط RSC7: '+e.message);return null;}
  let count=0;
  for(let i=0;i+8<=dec.length;){
    let match=true;for(let k=0;k<8;k++){if(dec[i+k]!==GTAV1[k]){match=false;break;}}
    if(match){dec.set(PS4,i);i+=8;count++;}else i++;
  }
  if(!count)log('  [WARN] لم يُعثر على قيمة GTAV1. قد يكون الملف متوافقًا مسبقًا أو أن بنية الملف مختلفة.');
  else log('  [FIX] تم استبدال القيمة '+count+' مرة.');
  const out=concat(data.subarray(0,16),await deflateRaw(dec),tail);
  log('  [SAVED] '+outName+' ('+out.length.toLocaleString()+' bytes)');
  return {name:outName,data:out};
}
const F={DXT1:0x31545844,DXT3:0x33545844,DXT5:0x35545844,ATI1:0x31495441,ATI2:0x32495441,BC7:0x20374342,A8R8G8B8:21,A1R5G5B5:25,A4R4G4B4:26};
const BLK={[F.DXT1]:8,[F.ATI1]:8,[F.DXT3]:16,[F.DXT5]:16,[F.ATI2]:16,[F.BC7]:16};
const BPP={[F.A8R8G8B8]:32,[F.A1R5G5B5]:16,[F.A4R4G4B4]:16};
const rsc7Size=f=>(((f>>>17)&0x7f)+(((f>>>11)&0x3f)<<1)+(((f>>>7)&0x0f)<<2)+(((f>>>5)&0x03)<<3)+(((f>>>4)&1)<<4))*(0x2000*2**(f&15));
const ptrOff=p=>Number(p&0x0fffffffn);
async function decompressPayload(d){
  const formats=d[0]===0x78?['deflate','deflate-raw','gzip']:['deflate-raw','deflate','gzip'];
  let last;
  for(const f of formats){try{return await streamTransform(d,f,'decompress');}catch(e){last=e;}}
  throw new Error('تعذّر فك ضغط بيانات YTD. '+(last?last.message:''));
}
function mipBytes(w,h,fmt){const b=BLK[fmt];if(b)return Math.max(1,(w+3)>>2)*Math.max(1,(h+3)>>2)*b;return Math.max(1,w)*Math.max(1,h)*((BPP[fmt]||32)>>3);}
function buildDDS(t){
  const {width:w,height:h,mips,fmt,pixels}=t;
  if(!w||!h||w>16384||h>16384)throw new Error('أبعاد Texture غير منطقية');
  const header=new Uint8Array(128),v=new DataView(header.buffer),set=(o,x)=>v.setUint32(o,x>>>0,true),blk=BLK[fmt];
  let flags=0x1|0x2|0x4|0x1000,pitch,pf;
  if(blk){pitch=Math.max(1,(w+3)>>2)*Math.max(1,(h+3)>>2)*blk;flags|=0x80000;pf=[32,0x4,fmt,0,0,0,0,0];}
  else {const bpp=BPP[fmt]||32;pitch=Math.max(1,(w*bpp+7)>>3);flags|=0x8;pf=[32,0x41,0,bpp,...(bpp===32?[0xff0000,0xff00,0xff,0xff000000]:[0x7c00,0x3e0,0x1f,0x8000])];}
  if(mips>1)flags|=0x20000;
  header.set(enc.encode('DDS '),0);
  [124,flags,h,w,pitch,0,mips].forEach((x,i)=>set(4+i*4,x));
  pf.forEach((x,i)=>set(76+i*4,x));
  set(108,0x1000|(mips>1?0x400000|0x8:0));
  return concat(header,pixels);
}
async function extractYTD(name,data,log){
  if(!isRSC7(data))throw new Error('الملف ليس RSC7. فك ملف YTD من RPF أولًا وتأكد أنه ملف صالح.');
  const dv0=new DataView(data.buffer,data.byteOffset,data.byteLength),flags=dv0.getUint32(8,true),virtSize=rsc7Size(flags);
  if(!Number.isSafeInteger(virtSize)||virtSize<=0||virtSize>512*1024*1024)throw new Error('حجم RSC7 الافتراضي غير صالح أو أكبر من الحد الآمن (512MB).');
  log('  virt_flags=0x'+flags.toString(16).toUpperCase()+' declared_virt='+virtSize.toLocaleString());
  const dec=await decompressPayload(data.subarray(16));
  const virt=new Uint8Array(virtSize);virt.set(dec.subarray(0,virtSize));const phys=dec.subarray(virtSize),dv=new DataView(virt.buffer);
  if(virt.length<0x3a)throw new Error('بيانات RSC7 أقصر من المتوقع.');

  if(arr<0||arr+count*8>virt.length)throw new Error('مؤشر جدول textures خارج حدود الملف.');
  log('  decompressed='+dec.length.toLocaleString()+' virtual='+virt.length.toLocaleString()+'B physical='+phys.length.toLocaleString()+'B');
  const out=[];
  for(let i=0;i<count;i++){
    try{
      const tp=dv.getBigUint64(arr+i*8,true);if(tp===0n)continue;
      const tb=ptrOff(tp);
      if(tb+0x78>virt.length)throw new Error('بيانات Texture خارج حدود الملف');

      if(np){let o=ptrOff(np);while(o<virt.length&&virt[o]&&nm.length<256)nm+=String.fromCharCode(virt[o++]);}
      nm=nm.trim()||'tex_'+i;const safe=nm.replace(/[^A-Za-z0-9._-]/g,'')||'tex_'+i;

      if(!BLK[fmt]&&!BPP[fmt])throw new Error('صيغة Texture غير مدعومة: 0x'+fmt.toString(16));
      let total=0,cw=width,ch=height;for(let m=0;m<mips;m++){total+=mipBytes(cw,ch,fmt);cw=Math.max(1,cw>>1);ch=Math.max(1,ch>>1);if(total>512*1024*1024)throw new Error('بيانات Texture أكبر من الحد الآمن');}
      if(po<0||po>=phys.length)throw new Error('مؤشر بيانات الصورة خارج حدود الملف');
      const avail=phys.length-po,pixels=phys.slice(po,po+Math.min(total,avail));
      if(pixels.length<total)throw new Error('بيانات Texture ناقصة ('+pixels.length+' من '+total+' bytes)');
      log('  ['+(i+1)+'/'+count+'] '+safe+' '+width+'x'+height+' mips='+mips+' pix='+pixels.length.toLocaleString()+'B');
      out.push({name:stem(name)+'/'+(safe.toLowerCase().endsWith('.dds')?safe:safe+'.dds'),data:buildDDS({width,height,mips,fmt,pixels})});
    }catch(e){log('  [SKIP] Texture #'+i+': '+e.message);}
  }
  if(!out.length)throw new Error('لم يتم استخراج أي Texture صالح. قد يكون تنسيق YTD مختلفًا عن المتوقع.');
  return out;
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function makeZip(files){
  if(files.length>65535)throw new Error('عدد الملفات أكبر من حد ZIP التقليدي.');
  const parts=[],central=[];let off=0;
  for(const f of files){
    if(f.data.length>0xffffffff||off>0xffffffff)throw new Error('حجم الملفات يتجاوز حد ZIP التقليدي.');
    const nm=enc.encode(f.name);if(nm.length>65535)throw new Error('اسم ملف طويل جدًا');

    const c=new DataView(new ArrayBuffer(46));

const TOOLS={
convert:{tab:'تحويل الموديلات',desc:'يعالج ملفات موديلات GTA V من PC إلى صيغة مستهدفة لـ PS4 حسب التحويل المحدود الموجود في الأداة.',note:'تنبيه: هذه الأداة ليست محوّل RAGE كاملًا. أنواع YCD وYMAP وYTYP وYMT تغيّر الامتداد فقط، وقد تحتاج أدوات متخصصة للتحويل الحقيقي.',accept:Object.keys(FILE_TYPES).join(' '),action:'حوّل الملفات',fn:convertModel},
ytd:{tab:'استخراج YTD',desc:'يحاول استخراج Textures من ملفات YTD المفكوكة إلى ملفات DDS.',note:'يجب فك ملف YTD من RPF أولًا. دعم بنية RSC7 وصيغ Texture محدود، وافحص النتائج قبل استخدامها.',accept:'.ytd',action:'استخرج الـ Textures',fn:extractYTD}
};
const $=id=>document.getElementById(id);let current='convert',files=[],busy=false,result=null;
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function render(){
 const t=TOOLS[current],nav=$('tabs');nav.textContent='';
 for(const[id,x]of Object.entries(TOOLS)){const b=document.createElement('button');b.type='button';b.textContent=x.tab;b.setAttribute('aria-selected',id===current?'true':'false');b.onclick=()=>{if(!busy){current=id;files=[];$('picker').value='';render();}};nav.appendChild(b);}
 $('desc').textContent=t.desc;$('note').textContent=t.note;$('accept').textContent=t.accept;$('picker').accept=t.accept.split(' ').join(',');$('go').textContent=t.action;
 const ul=$('files');ul.textContent='';for(const f of files){const li=document.createElement('li'),n=document.createElement('span'),s=document.createElement('small');n.textContent=f.name;s.textContent=fmtSize(f.size);li.append(n,s);ul.appendChild(li);}
 $('go').disabled=busy||!files.length;$('status').hidden=true;$('dl').hidden=true;$('log').textContent='';$('fill').style.width='0%';result=null;
}
function show(msg,cls,pct){$('status').hidden=false;$('msg').textContent=msg;$('msg').className=cls||'';if(pct!=null)$('fill').style.width=Math.max(0,Math.min(100,pct))+'%';}
function setFiles(list){
 if(busy)return;
 const accepted=new Set(TOOLS[current].accept.split(' ').map(x=>x.toLowerCase()));
 files=Array.from(list).filter(f=>accepted.has(ext(f.name)));
 render();
 const ignored=Array.from(list).length-files.length;
 if(ignored)show('تم تجاهل '+ignored+' ملف لأن امتداده غير مدعوم في الأداة الحالية.','err',0);
}
async function run(){
 if(busy||!files.length)return;

 const t=TOOLS[current],logEl=$('log'),log=s=>{logEl.textContent+=s+'\n';logEl.scrollTop=logEl.scrollHeight;},out=[];let ok=0,bad=0;
 try{
  for(let i=0;i<files.length;i++){
   const f=files[i];show('جاري المعالجة… ('+(i+1)+'/'+files.length+')','',i/files.length*100);await new Promise(r=>setTimeout(r,0));
   try{if(f.size>512*1024*1024)throw new Error('الملف أكبر من الحد الآمن 512MB');const data=new Uint8Array(await f.arrayBuffer()),r=await t.fn(f.name,data,log);if(r){(Array.isArray(r)?r:[r]).forEach(x=>out.push(x));ok++;}else bad++;}
   catch(e){bad++;log('  [FAILED] '+f.name+': '+(e.message||e));}
  }
  if(!out.length){show('لم تتم معالجة أي ملف بنجاح. راجع سجل الأخطاء بالأسفل.','err',100);return;}
  result=out.length===1?out[0]:{name:current==='convert'?'converted_models.zip':'extracted_textures.zip',data:makeZip(out)};
  show('تمت معالجة '+ok+' ملف'+(bad?'، وفشل أو تم تجاهل '+bad+' ملف':'')+'. راجع التحذيرات في السجل.','ok',100);
  $('dl').textContent='تحميل '+result.name;$('dl').hidden=false;
 }catch(e){show('تعذّرت العملية: '+(e.message||e),'err',100);log('[FATAL] '+(e.stack||e.message||e));}

$('dl').onclick=()=>{if(!result)return;const url=URL.createObjectURL(new Blob([result.data],{type:'application/octet-stream'})),a=document.createElement('a');a.href=url;a.download=result.name.split('/').pop();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);};
const drop=$('drop');$('picker').onchange=e=>{setFiles(e.target.files);e.target.value='';};
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>setFiles(e.dataTransfer.files));
drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('picker').click();}});
